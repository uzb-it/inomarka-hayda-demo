<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Inomarka Hayda</title>
<link rel="icon" href="assets/avatar.jpg">
<link rel="preload" href="assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin>
<script async src="https://telegram.org/js/telegram-web-app.js" onload="window.__tg&&window.__tg()"></script>
<style>
@font-face{font-family:"Manrope";src:url(assets/fonts/manrope-latin.woff2) format("woff2");font-weight:500 800;font-display:swap}
@font-face{font-family:"Unbounded";src:url(assets/fonts/unbounded-latin.woff2) format("woff2");font-weight:700 800;font-display:swap}
:root{
  --bg:#0b0b0d; --bg2:#111115; --card:#16161b; --card2:#1d1d23; --card3:#26262e;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --text:#f4f4f5; --text2:#c6c6cd; --muted:#8e8e98; --dim:#5f5f69;
  --red:#e3262f; --red2:#ff4b3e; --redbg:rgba(227,38,47,.13);
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --data:#3987e5; --track:rgba(57,135,229,.15);
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font:600 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:var(--text)}
img,video{display:block}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px calc(96px + var(--safe-b))}
.view{display:none;animation:in .35s cubic-bezier(.2,.8,.2,1)}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
/* header */
.hd{display:flex;align-items:center;gap:12px;padding:16px 0 6px}
.ava{width:42px;height:42px;border-radius:50%;background:url(assets/avatar.jpg) center/cover;box-shadow:0 0 0 2px var(--red),0 0 0 4px var(--bg);flex:none}
.hd b{display:block;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.03em}
.hd b em{font-style:normal;color:var(--red)}
.hd span{font-size:12.5px;color:var(--muted)}
.tag{margin-left:auto;font-size:11px;font-weight:800;color:#ffd27a;background:rgba(250,178,25,.1);border:1px solid rgba(250,178,25,.25);padding:4px 9px;border-radius:99px;white-space:nowrap}
h2{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.15;letter-spacing:-.01em;margin:22px 0 6px}
h3{font-size:15px;font-weight:800;letter-spacing:-.005em}
.sub{color:var(--muted);font-size:13.5px;font-weight:600}
.eb{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.demo{display:inline-block;font-size:10.5px;font-weight:800;color:#ffd27a;background:rgba(250,178,25,.1);padding:2px 7px;border-radius:6px;vertical-align:2px}
.real{display:inline-block;font-size:10.5px;font-weight:800;color:#6fe06f;background:rgba(12,163,12,.12);padding:2px 7px;border-radius:6px;vertical-align:2px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 18px;margin-top:10px;background:radial-gradient(120% 90% at 100% 0%,rgba(227,38,47,.28),transparent 60%),linear-gradient(160deg,#1b1b21,#121216);border:1px solid var(--line2)}
.hero::after{content:"";position:absolute;right:-60px;bottom:-60px;width:180px;height:180px;border-radius:50%;border:30px solid rgba(255,255,255,.03)}
.big{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:10px}
.bigl{color:var(--text2);font-size:14px;margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;position:relative;z-index:1}
.tile{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.tile b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em}
.tile span{font-size:12px;color:var(--muted);line-height:1.3;display:block}
/* charts */
.chart{position:relative;margin-top:12px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .tt{position:absolute;pointer-events:none;background:#f4f4f5;color:#0b0b0d;font-size:12px;font-weight:800;padding:5px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .15s}
.chart .tt.on{opacity:1}
.callout{display:flex;gap:12px;align-items:center;margin-top:10px;padding:12px;border-radius:14px;background:var(--redbg);border:1px solid rgba(227,38,47,.25)}
.callout b{font-size:28px;font-weight:800;color:var(--red2);letter-spacing:-.02em;line-height:1}
.callout span{font-size:13px;color:var(--text2)}
/* pains */
.pains{display:grid;gap:10px;margin-top:12px}
.pain{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.pain i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:20px;background:var(--card2)}
.pain b{font-size:15px;display:block;line-height:1.3}
.pain p{font-size:13px;color:var(--muted);margin-top:3px}
.quote{margin-top:8px;font-size:12px;color:var(--text2);border-left:3px solid var(--red);padding:6px 10px;background:rgba(255,255,255,.03);border-radius:0 8px 8px 0;font-style:italic}
/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:14px;padding:4px;margin-top:12px;position:relative}
.seg button{position:relative;z-index:1;height:38px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted);transition:color .25s}
.seg button.on{color:#fff}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:var(--card3);transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s}
.seg.b .pill{transform:translateX(100%);background:var(--red)}
.cmp{display:grid;gap:8px;margin-top:10px}
.cmp div{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px;transition:background .3s,border-color .3s}
.cmp div i{font-style:normal;font-size:20px;text-align:center}
.cmp.b div{border-color:rgba(12,163,12,.3);background:rgba(12,163,12,.06)}
.cmp span{transition:opacity .2s}
.roles{display:grid;gap:10px;margin-top:12px}
.role{display:grid;grid-template-columns:48px 1fr 20px;gap:12px;align-items:center;text-align:left;background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:18px;padding:14px;width:100%}
.role i{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:22px;background:var(--redbg)}
.role b{display:block;font-size:15px}
.role span{font-size:12.5px;color:var(--muted)}
.role svg{width:18px;height:18px;color:var(--muted)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(13,13,16,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(8px + var(--safe-b))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:800;color:var(--dim);padding:5px 0;transition:color .2s}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--text)}
.tab.on svg{color:var(--red2)}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;font-weight:800;font-size:15.5px;transition:transform .12s,background .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--red);color:#fff;box-shadow:0 12px 30px -12px rgba(227,38,47,.7)}
.btn-line{background:var(--card2);border:1px solid var(--line2)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn svg{width:18px;height:18px}
.bar{position:fixed;left:0;right:0;bottom:calc(64px + var(--safe-b));z-index:35;padding:10px 16px;background:linear-gradient(180deg,transparent,var(--bg) 35%);max-width:520px;margin:0 auto}
/* wizard */
.prog{display:flex;gap:5px;margin-top:14px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--card3);transition:background .3s}
.prog i.on{background:var(--red)}
.stepn{font-size:12.5px;color:var(--muted);margin-top:10px;font-weight:800}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;transition:border-color .2s,background .2s,transform .12s}
.opt:active{transform:scale(.96)}
.opt b{display:block;font-size:14.5px}
.opt span{font-size:11.5px;color:var(--muted)}
.opt.on{border-color:var(--red);background:var(--redbg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{height:40px;padding:0 15px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:13.5px;transition:.2s}
.chip.on{border-color:var(--red);background:var(--redbg)}
.chip:disabled{opacity:.35;text-decoration:line-through}
.field{margin-top:14px}
.field label{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:6px}
.field input{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);padding:0 14px;font-size:16px;font-weight:700;outline:none}
.field input:focus{border-color:var(--red)}
.svc{display:grid;gap:10px;margin-top:14px}
.svc button{display:grid;grid-template-columns:48px 1fr;gap:12px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;transition:.2s}
.svc button.on{border-color:var(--red);background:var(--redbg)}
.svc i{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;font-style:normal;background:var(--card2)}
.svc b{font-size:16px}
.svc p{font-size:13px;color:var(--muted);margin-top:3px}
.days{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:76px;padding:10px 0;border-radius:16px;background:var(--card);border:1.5px solid var(--line);text-align:center}
.day b{display:block;font-size:20px;font-weight:800}
.day span{font-size:11.5px;color:var(--muted);font-weight:800}
.day.on{border-color:var(--red);background:var(--redbg)}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.hist{margin-top:14px;border-radius:18px;padding:14px;background:linear-gradient(150deg,rgba(57,135,229,.14),transparent 70%),var(--card);border:1px solid rgba(57,135,229,.3)}
.hist ul{list-style:none;margin-top:8px;display:grid;gap:6px}
.hist li{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--text2)}
.hist li span{color:var(--muted);white-space:nowrap;font-size:12px}
.newc{margin-top:14px;border-radius:18px;padding:14px;background:rgba(12,163,12,.08);border:1px solid rgba(12,163,12,.3);font-size:14px}
/* admin message */
.tgmsg{margin-top:12px;border-radius:18px;background:#17212b;border:1px solid #22303d;padding:12px 14px;position:relative}
.tgmsg .who{display:flex;align-items:center;gap:8px;font-size:12px;color:#7d8e9e;font-weight:700;margin-bottom:8px}
.tgmsg .who i{width:22px;height:22px;border-radius:50%;background:url(assets/avatar.jpg) center/cover}
.tgmsg .t{font-size:14px;line-height:1.5;white-space:pre-line;color:#e8edf2}
.tgmsg .kb{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px}
.tgmsg .kb span{background:rgba(43,82,120,.6);border-radius:8px;padding:7px 4px;text-align:center;font-size:12px;font-weight:800;color:#fff}
.lbl{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.lbl::before{content:"👀";font-size:14px}
/* ticket */
.ticket{margin-top:14px;border-radius:22px;background:#f4f4f5;color:#0b0b0d;padding:18px;position:relative;overflow:hidden}
.ticket::before,.ticket::after{content:"";position:absolute;top:96px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.ticket::before{left:-11px}.ticket::after{right:-11px}
.ticket .no{font-size:12px;font-weight:800;color:#666}
.ticket h4{font-family:var(--display);font-size:18px;margin-top:2px;text-transform:uppercase;line-height:1.2}
.ticket .dash{border-top:2px dashed #ccc;margin:16px -18px 12px}
.ticket dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.ticket dt{color:#666;font-weight:700}
.ticket dd{font-weight:800;text-align:right}
.ok-anim{display:grid;place-items:center;margin:18px auto 0;width:84px;height:84px;border-radius:50%;background:rgba(12,163,12,.15);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.ok-anim svg{width:44px;height:44px;color:#4ade4a}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.tl{margin-top:16px;display:grid;gap:10px}
.tl button.ff{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--line2);color:var(--text2);font-weight:800;font-size:14px}
.tl button.ff:disabled{display:none}
.notif{border-radius:18px;background:var(--card2);border:1px solid var(--line2);padding:14px;animation:in .4s}
.notif .top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:800}
.notif .top i{width:20px;height:20px;border-radius:6px;background:url(assets/avatar.jpg) center/cover}
.notif b{display:block;margin-top:6px;font-size:15px}
.notif p{font-size:13.5px;color:var(--text2);margin-top:4px}
.notif a{color:#6ab0ff;font-weight:800;text-decoration:none}
.stars{display:flex;gap:6px;margin-top:10px}
.stars button{font-size:28px;filter:grayscale(1) opacity(.4);transition:.15s}
.stars button.on{filter:none;transform:scale(1.1)}
.tip{display:flex;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(255,210,122,.07);border:1px solid rgba(255,210,122,.18);font-size:13px;color:#f1dfb5}
.tip::before{content:"💡";font-size:16px}
/* owner */
.carousel{display:flex;gap:12px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.carousel::-webkit-scrollbar{display:none}
.cc{flex:none;width:92px;text-align:center;scroll-snap-align:start}
.cc .ph{width:84px;height:84px;margin:0 auto;border-radius:50%;background:#222 center/cover;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--line2);transition:box-shadow .2s}
.cc.on .ph{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--red)}
.cc b{display:block;font-size:10.5px;font-weight:800;margin-top:8px;line-height:1.2;text-transform:uppercase;height:2.4em;overflow:hidden}
.cc span{font-size:11px;color:var(--muted)}
.rep{margin-top:10px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#1b1b21,#141418);border:1px solid var(--line2)}
.rep .vbox{position:relative;width:200px;height:200px;margin:22px auto 0}
.rep .vbox .disc{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#111}
.rep .vbox video{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover}
.rep .vbox svg{position:absolute;inset:-8px;width:216px;height:216px;transform:rotate(-90deg)}
.rep .vbox circle{fill:none;stroke-width:3.5}
.rep .in{padding:16px}
.rep h3{font-family:var(--display);font-size:17px;text-transform:uppercase;text-align:center;line-height:1.2}
.rep .price{text-align:center;font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:4px;transition:color .3s}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.05)}
.st svg{width:13px;height:13px}
.meter{position:relative;height:10px;border-radius:5px;background:var(--card3);margin-top:8px;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.meter em{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;border-radius:2px}
.fun{display:grid;gap:9px;margin-top:10px}
.fr{display:grid;grid-template-columns:118px 1fr 40px;gap:10px;align-items:center;font-size:13px;color:var(--text2);font-weight:700}
.fr .b{height:10px;border-radius:0 5px 5px 0;background:var(--data);transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.fr .v{text-align:right;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acts .btn{height:48px;font-size:14px}
/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;background:var(--bg2);border-radius:24px 24px 0 0;border-top:1px solid var(--line2);padding:10px 18px calc(20px + var(--safe-b));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--card3);margin:0 auto 14px}
.sheet h3{font-size:18px}
.range{width:100%;margin:22px 0 6px;accent-color:var(--red);height:28px}
.np{font-size:36px;font-weight:800;letter-spacing:-.02em;text-align:center;margin-top:10px}
.np small{display:block;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:0}
.paybtns{display:grid;gap:10px;margin-top:16px}
.payb{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 18px;border-radius:16px;background:var(--card);border:1.5px solid var(--line2);font-size:17px;font-weight:800}
.payb small{font-size:12px;color:var(--muted);font-weight:700}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--card3);border-top-color:var(--red);animation:sp 0.8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* boss */
.notifcard{margin-top:12px;border-radius:20px;background:linear-gradient(160deg,#1f1f26,#16161b);border:1px solid var(--line2);padding:16px}
.notifcard .top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:800}
.notifcard .top i{width:22px;height:22px;border-radius:7px;background:url(assets/avatar.jpg) center/cover}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kpi{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.funnel4{display:grid;gap:6px;margin-top:10px}
.funnel4 div{display:flex;justify-content:space-between;align-items:center;height:40px;border-radius:12px;padding:0 14px;background:var(--track);font-size:13.5px;font-weight:800;position:relative;overflow:hidden}
.funnel4 div::before{content:"";position:absolute;inset:0;width:var(--w);background:rgba(57,135,229,.35);border-radius:12px}
.funnel4 div *{position:relative}
.list{display:grid;gap:2px;margin-top:8px}
.li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .ph{width:44px;height:44px;border-radius:50%;background:#222 center/cover;flex:none;display:grid;place-items:center;font-weight:800;color:var(--muted);font-size:15px;overflow:hidden}
.li .ph img{width:100%;height:100%;object-fit:cover}
.li b{display:block;font-size:13.5px;line-height:1.3;text-transform:uppercase}
.li span{font-size:12px;color:var(--muted)}
.li .r{margin-left:auto;text-align:right;white-space:nowrap}
.sold{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#6fe06f;background:rgba(12,163,12,.12);padding:2px 7px;border-radius:6px}
.rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--card2);font-size:12px;font-weight:800;flex:none}
.al{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.al:last-child{border-bottom:0}
.al i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:16px}
.al b{font-size:13.5px;display:block;line-height:1.35}
.al span{font-size:12px;color:var(--muted)}
/* search */
.sbox{position:relative;margin-top:14px}
.sbox input{width:100%;height:52px;border-radius:16px;border:1.5px solid var(--line2);background:var(--card);padding:0 16px 0 46px;font-size:16px;font-weight:700;outline:none}
.sbox input:focus{border-color:var(--red)}
.sbox svg{position:absolute;left:16px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted)}
.sstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);z-index:80;background:#f4f4f5;color:#0b0b0d;font-weight:800;font-size:13.5px;padding:11px 16px;border-radius:14px;box-shadow:0 14px 30px -10px #000;transition:transform .35s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 32px);display:flex;gap:8px;align-items:center}
.toast.on{transform:translate(-50%,0)}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.6}}
.next{margin-top:18px}
.foot{margin-top:24px;text-align:center;font-size:11.5px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="hd"><i class="ava"></i><div><b>INOMARKA <em>HAYDA</em></b><span>Bot namunasi · kanal tahlili</span></div><span class="tag">DEMO</span></div>

  <!-- ASOSIY -->
  <section class="view on" id="v-home"></section>
  <!-- SOTUVCHI -->
  <section class="view" id="v-sell"></section>
  <!-- EGASI -->
  <section class="view" id="v-own"></section>
  <!-- RAHBAR -->
  <section class="view" id="v-boss"></section>
  <!-- QIDIRUV -->
  <section class="view" id="v-find"></section>
</div>

<div class="bar" id="bar" hidden><button class="btn btn-red" id="barBtn">Davom etish</button></div>

<nav class="tabs" id="tabs">
  <button class="tab on" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Raqamlar</button>
  <button class="tab" data-v="sell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 17h14v-5l-2-5H7l-2 5z"/><circle cx="8" cy="17" r="2"/><circle cx="16" cy="17" r="2"/></svg>Sotuvchi</button>
  <button class="tab" data-v="own"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/></svg>Egasi</button>
  <button class="tab" data-v="boss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Rahbar</button>
  <button class="tab" data-v="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Qidiruv</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"><i></i><span></span></div>

<script src="core.js"></script>
<script>
(() => {
"use strict";
const D = window.IH;
// скрипт Telegram грузится асинхронно: первый экран рисуется, не дожидаясь его
let tg = null, inTG = false;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = n => Math.round(n).toLocaleString("ru-RU").replace(/[ ,]/g, " ");
const money = n => "$" + num(n);
const compact = n => n >= 1000 ? (n / 1000).toFixed(1).replace(".0", "") + "K" : String(n);
const MON = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const MS = ["yan","fev","mar","apr","may","iyn","iyl","avg","sen","okt","noy","dek"];
const WD = ["Yak","Du","Se","Chor","Pay","Ju","Sha"];
const dUz = (d, y) => { const [Y, M, DD] = d.split("-").map(Number); return `${DD}-${MON[M - 1]}${y ? " " + Y : ""}`; };
const post = m => `https://t.me/inomarkahayda/${m}`;
const thumb = id => `assets/s/${id}.jpg`;
const poster = id => `assets/cars/${id}.jpg`;

/* поиск и история телефонов: idx.js (~50 КБ) нужен не на первом экране — грузим после него */
let X = null, xP = null;
function loadIdx() {
  return xP ??= new Promise((res, rej) => {
    const sc = document.createElement("script"); sc.src = "idx.js";
    sc.onload = () => {
      const R = window.IHX;
      const rows = R.rows.map(r => ({ id: r[0], m: r[0] - r[1], t: r[2], d: `20${r[3].slice(0, 2)}-${r[3].slice(2, 4)}-${r[3].slice(4)}`, s: r[4], v: r[5] * 100, b: r[6] >= 0 ? R.B[r[6]] : "", th: r[7] }));
      X = { rows, phones: R.phones, byId: Object.fromEntries(rows.map(r => [r.id, r])) }; res(X);
    };
    sc.onerror = () => { xP = null; rej(new Error("idx")); };
    document.head.appendChild(sc);
  });
}
const S = D.stats;

/* ---------- Telegram ---------- */
const v = x => { try { return !!tg && tg.isVersionAtLeast(x); } catch (e) { return false; } };
function initTG() {
  if (tg || !window.Telegram?.WebApp) return;
  tg = window.Telegram.WebApp; inTG = !!tg.initData;
  try { tg.ready(); tg.expand(); } catch (e) {}
  if (v("6.1")) { tg.setHeaderColor("#0b0b0d"); tg.setBackgroundColor("#0b0b0d"); tg.BackButton.onClick(() => backFn && backFn()); if (backFn) tg.BackButton.show(); }
  if (v("7.10")) try { tg.setBottomBarColor("#0d0d10"); } catch (e) {}
  if (v("7.7")) try { tg.disableVerticalSwipes(); } catch (e) {}
}
window.__tg = initTG;
const hap = (k = "light") => { if (v("6.1")) try { k === "ok" ? tg.HapticFeedback.notificationOccurred("success") : k === "sel" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.impactOccurred(k); } catch (e) {} };
const openLink = u => { hap(); if (inTG && /^https:\/\/t\.me\//.test(u)) tg.openTelegramLink(u); else window.open(u, "_blank", "noopener"); };
let backFn = null;
function setBack(fn) {
  backFn = fn;
  if (!tg || !v("6.1")) return;
  try { fn ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
}

/* ---------- ui helpers ---------- */
let toastT;
function toast(t) { const e = $("#toast"); $("span", e).textContent = t; e.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove("on"), 2600); }
function sheet(html, onOpen) {
  $("#sheetBody").innerHTML = html; $("#sheet").classList.add("on"); $("#scrim").classList.add("on");
  const prev = backFn; setBack(() => { closeSheet(); setBack(prev); });
  onOpen && onOpen($("#sheetBody"));
}
function closeSheet() { $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); }
$("#scrim").onclick = () => backFn ? backFn() : closeSheet();
function bar(label, fn, enabled = true) {
  const b = $("#bar"), btn = $("#barBtn");
  if (!label) { b.hidden = true; return; }
  b.hidden = false; btn.textContent = label; btn.disabled = !enabled; btn.onclick = () => { hap("medium"); fn(); };
}
function confetti() {
  const c = document.createElement("div"); c.className = "confetti";
  const cols = ["#e3262f", "#f4f4f5", "#fab219", "#3987e5", "#0ca30c"];
  for (let i = 0; i < 70; i++) { const p = document.createElement("i"); p.style.left = Math.random() * 100 + "%"; p.style.background = cols[i % 5]; p.style.animationDelay = Math.random() * .4 + "s"; p.style.transform = `rotate(${Math.random() * 360}deg)`; c.appendChild(p); }
  document.body.appendChild(c); setTimeout(() => c.remove(), 2400);
}
const tgmsg = (title, body, kb) => `<div class="tgmsg"><div class="who"><i></i>${esc(title)}</div><div class="t">${body}</div>${kb ? `<div class="kb">${kb.map(k => `<span>${k}</span>`).join("")}</div>` : ""}</div>`;
const tipH = t => `<div class="tip"><span>${t}</span></div>`;

/* ---------- charts (одна серия, тап — подсказка) ---------- */
function bars(el, rows, { h = 150, hl = () => false, note = "" } = {}) {
  const W = 340, pad = 18, n = rows.length, gap = n > 16 ? 3 : 5;
  const bw = (W - gap * (n - 1)) / n, mx = Math.max(...rows.map(r => r.v), 1);
  let svg = `<svg viewBox="0 -14 ${W} ${h + pad + 14}" role="img">`;
  [0.5, 1].forEach(f => { const y = h - h * f; svg += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.06)" stroke-dasharray="3 4"/>`; });
  rows.forEach((r, i) => {
    const bh = Math.max(2, (r.v / mx) * (h - 4)), x = i * (bw + gap), y = h - bh, rr = Math.min(4, bw / 2);
    const fill = hl(r, i) ? "var(--red2)" : r.dim ? "rgba(57,135,229,.4)" : "var(--data)";
    svg += `<path d="M${x},${h} V${y + rr} Q${x},${y} ${x + rr},${y} H${x + bw - rr} Q${x + bw},${y} ${x + bw},${y + rr} V${h} Z" fill="${fill}"/>`;
    svg += `<rect class="hit" data-i="${i}" x="${x - gap / 2}" y="-14" width="${bw + gap}" height="${h + 14}" fill="transparent"/>`;
    if (r.lab) svg += `<text x="${x + bw / 2}" y="${h + 14}" text-anchor="middle" font-size="10" font-weight="700" fill="#5f5f69" font-family="Manrope">${r.lab}</text>`;
  });
  svg += `<line x1="0" x2="${W}" y1="${h}" y2="${h}" stroke="rgba(255,255,255,.12)"/></svg>`;
  el.innerHTML = `<div class="chart">${svg}<div class="tt"></div></div>${note}`;
  const tt = $(".tt", el), wrap = $(".chart", el);
  const show = e => {
    const t = e.target.closest(".hit"); if (!t) return;
    const r = rows[+t.dataset.i], b = t.getBoundingClientRect(), w = wrap.getBoundingClientRect();
    const sc = $("svg", wrap).getBoundingClientRect().height / (h + pad + 14), yb = h - Math.max(2, (r.v / mx) * (h - 4));
    tt.textContent = r.tip; tt.style.left = Math.min(w.width - 60, Math.max(60, b.left - w.left + b.width / 2)) + "px"; tt.style.top = ((yb + 14) * sc - 4) + "px"; tt.classList.add("on"); hap("sel");
  };
  wrap.addEventListener("pointerdown", show); wrap.addEventListener("pointermove", e => e.pointerType === "mouse" && show(e));
  wrap.addEventListener("pointerleave", () => tt.classList.remove("on"));
}

/* ---------- навигация ---------- */
let cur = "home";
function go(vw) {
  cur = vw; hap("sel");
  $$(".view").forEach(x => x.classList.toggle("on", x.id === "v-" + vw));
  $$(".tab").forEach(x => x.classList.toggle("on", x.dataset.v === vw));
  closeSheet(); bar(null); setBack(null);
  scrollTo({ top: 0 });
  ({ home: renderHome, sell: renderSell, own: renderOwn, boss: renderBoss, find: renderFind })[vw]();
}
$$(".tab").forEach(t => t.onclick = () => go(t.dataset.v));
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) go(g.dataset.go); });

/* =============== RAQAMLAR =============== */
const PAIRS = [
  ["📝", `${S.last30.sellers} ta sotuvchi oyiga adminga yozadi — hammasi yozishmada`, "Sotuvchi 1 daqiqada o‘zi yoziladi, vaqt tanlaydi, to‘laydi"],
  ["🌙", `Postlarning ${S.late}%i kechki 19:00–03:00 da qo‘lda chiqadi`, "Video bir marta yuklanadi — jadval bo‘yicha o‘zi chiqadi"],
  ["🤝", `«Baraka bo‘ldi» har joyda qo‘lda — ${num(S.edited)} ta tahrir`, "Bitta tugma: kanal, Instagram, sayt"],
  ["📞", "Zaldagi mashina egalari «nima bo‘ldi?» deb qo‘ng‘iroq qiladi", "Har dushanba egasiga avtomatik hisobot"],
  ["⚠️", "Firibgarlar admin nomidan pul so‘raydi", "To‘lov faqat rasmiy Payme / Click orqali"],
  ["📊", "Raqamlar postlar ichida sochilgan", "Har kuni 21:00 da rahbarga tayyor hisobot"],
];
function renderHome() {
  const l = S.last30;
  $("#v-home").innerHTML = `
  <div class="hero"><div class="eb">Kanalingiz raqamlarda <span class="real">haqiqiy</span></div>
    <div class="big" id="bigN">0</div><div class="bigl">mashina e’loni · t.me/inomarkahayda</div>
    <div class="tiles">
      <div class="tile"><b>${S.soldPct}%</b><span>«Baraka bo‘ldi» belgisi</span></div>
      <div class="tile"><b>${l.perDay}</b><span>mashina kuniga (30 kun)</span></div>
      <div class="tile"><b>${l.sellers}</b><span>sotuvchi bir oyda</span></div>
      <div class="tile"><b>${compact(l.medViews)}</b><span>ko‘rish — bitta video</span></div>
    </div></div>
  <div class="card"><h3>Oylar bo‘yicha e’lonlar</h3><p class="sub">Yil ichida ikki baravardan ko‘p o‘sish — qo‘l mehnati ham shuncha o‘sdi</p><div id="chMonths"></div></div>
  <div class="card"><h3>Postlar qachon chiqadi</h3><p class="sub">So‘nggi 90 kun, Toshkent vaqti</p><div id="chHours"></div>
    <div class="callout"><b>${S.late}%</b><span>postlar kechqurun <b style="font-size:13px;color:var(--text)">19:00 dan 03:00 gacha</b> qo‘lda chiqariladi</span></div></div>
  <h2>Jamoaning qo‘l mehnati</h2><p class="sub">Kanaldan aniqlangan</p>
  <div class="pains">
    <div class="pain"><i>✍️</i><div><b>${num(S.edited)} ta post qo‘lda «Baraka bo‘ldi» ga tahrirlangan</b><p>Telegramda — keyin Instagramda yana alohida</p></div></div>
    <div class="pain"><i>🔁</i><div><b>${S.repeat3} ta doimiy sotuvchi — e’lonlarning ${S.repeatShare}%i</b><p>Dilerlar. Hozir ular alohida ajratilmaydi va paket sotilmaydi</p></div></div>
    <div class="pain"><i>⚠️</i><div><b>Firibgarlar admin nomidan pul so‘raydi</b><div class="quote">«Ogoh bo‘ling, yana adminlar nomidan pul so‘rab yozyapti…» — kanaldagi post</div></div></div>
  </div>
  <h2>Bot bilan nima o‘zgaradi</h2>
  <div class="seg" id="seg"><span class="pill"></span><button class="on" data-s="a">Hozir</button><button data-s="b">Bot bilan</button></div>
  <div class="cmp" id="cmp"></div>
  <h2>Uch tomondan sinab ko‘ring</h2>
  <div class="roles">
    <button class="role" data-go="sell"><i>🚘</i><div><b>Sotuvchi</b><span>Reklamaga 1 daqiqada yozilish</span></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>
    <button class="role" data-go="own"><i>🔑</i><div><b>Zaldagi mashina egasi</b><span>Haftalik hisobot va narx</span></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>
    <button class="role" data-go="boss"><i>👔</i><div><b>Rahbar</b><span>Har kuni 21:00 da hisobot</span></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>
  </div>
  <p class="foot">Ma’lumotlar: ochiq Telegram kanal, ${dUz(S.first, 1)} — ${dUz(S.last, 1)} · ${num(S.posts)} ta post</p>`;
  // счётчик
  const el = $("#bigN"), t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / 1100); el.textContent = num(S.cars * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
  const ms = S.months.map((m, i) => { const [y, mm] = m.m.split("-").map(Number); const part = i === S.months.length - 1; return { v: m.cars, dim: part, lab: mm === 1 || i === 0 || part ? MS[mm - 1] + (mm === 1 || i === 0 ? " " + String(y).slice(2) : "") : "", tip: `${MON[mm - 1]} ${y}: ${m.cars} ta${part ? " (oy tugamagan)" : ""} · 🤝 ${m.sold}` }; });
  bars($("#chMonths"), ms, { h: 140 });
  const late = h => h >= 19 || h < 3;
  bars($("#chHours"), S.hours.map((n, h) => ({ v: n, lab: h % 3 === 0 ? String(h) : "", tip: `${String(h).padStart(2, "0")}:00 — ${n} ta post` })), { h: 120, hl: (r, i) => late(i) });
  const cmp = side => $("#cmp").innerHTML = PAIRS.map(([i, a, b]) => `<div><i>${side === "b" ? "✅" : i}</i><span>${esc(side === "b" ? b : a)}</span></div>`).join("");
  cmp("a"); $("#cmp").className = "cmp";
  $("#seg").onclick = e => { const b = e.target.closest("button"); if (!b) return; hap("sel"); const s = b.dataset.s; $$("#seg button").forEach(x => x.classList.toggle("on", x === b)); $("#seg").classList.toggle("b", s === "b"); $("#cmp").classList.toggle("b", s === "b"); cmp(s); };
}

/* =============== SOTUVCHI =============== */
const W = { step: 0, no: 1040 + Math.floor(Math.random() * 60) };
const STEPS = 6;
function wizHead(n, title, sub) {
  return `<div class="prog">${Array.from({ length: STEPS }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</div>
  <div class="stepn">${n}/${STEPS}</div><h2 style="margin-top:4px">${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ""}`;
}
function renderSell() {
  const V = $("#v-sell");
  V.onclick = null;
  setBack(W.step > 0 && W.step < 7 ? () => { W.step--; renderSell(); } : null);
  bar(null);
  if (W.step === 0) {
    V.innerHTML = `<div class="hero" style="padding:18px"><div class="eb">Sotuvchi tomoni</div>
      <h2 style="margin:8px 0 6px">Reklamaga 1 daqiqada yozilish</h2>
      <p class="sub" style="color:var(--text2)"><b style="color:#fff">Hozir:</b> sotuvchi adminga yozadi — model, narx, kun, to‘lov hammasi yozishmada. Bir oyda ${S.last30.sellers} ta shunday sotuvchi.</p>
      <p class="sub" style="color:var(--text2);margin-top:6px"><b style="color:#fff">Bot bilan:</b> hammasini o‘zi to‘ldiradi. Sinab ko‘ring — siz mashinasini sotmoqchi bo‘lgan mijozsiz.</p></div>
      ${wizHead(1, "Markani tanlang", "Kanalingizda eng ko‘p chiqqan markalar")}
      <div class="grid3">${D.brands.map(b => `<button class="opt${W.brand === b.b ? " on" : ""}" data-b="${esc(b.b)}"><b>${esc(b.b)}</b><span>${num(b.n)} e’lon</span></button>`).join("")}</div>`;
    $$("[data-b]", V).forEach(x => x.onclick = () => { hap("sel"); W.brand = x.dataset.b; W.model = ""; W.step = 1; renderSell(); });
  }
  if (W.step === 1) {
    const b = D.brands.find(x => x.b === W.brand);
    V.innerHTML = `${wizHead(2, "Model", "Tugmalar — kanalda eng ko‘p chiqqan modellar")}
      <div class="chips">${b.models.map(m => `<button class="chip${W.model === m ? " on" : ""}" data-m="${esc(m)}">${esc(m)}</button>`).join("")}</div>
      <div class="field"><label>Yoki o‘zingiz yozing</label><input id="mIn" placeholder="masalan, GLE 450 Coupe" value="${esc(W.model || "")}" autocomplete="off"></div>`;
    const ok = () => bar("Davom etish", () => { W.step = 2; renderSell(); }, !!W.model);
    $$("[data-m]", V).forEach(x => x.onclick = () => { hap("sel"); W.model = x.dataset.m; $("#mIn").value = W.model; $$("[data-m]", V).forEach(c => c.classList.toggle("on", c === x)); ok(); });
    $("#mIn").oninput = e => { W.model = e.target.value.trim().toUpperCase(); $$("[data-m]", V).forEach(c => c.classList.toggle("on", c.dataset.m === W.model)); ok(); };
    ok();

  });
}

/* =============== QIDIRUV =============== */
let Q = "";
function renderFind() {
  $("#v-find").innerHTML = `<div class="eb" style="margin-top:14px">Mashina tarixi</div>
    <h2 style="margin-top:6px">Bu model qanchalik tez sotiladi?</h2>
    <p class="sub">Kanalingizdagi ${num(D.nIdx)} ta e’londan qidiradi</p>
    <div class="sbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="G63, LX570, Zeekr, Prado…" value="${esc(Q)}" autocomplete="off" enterkeyhint="search"></div>
    <div class="chips">${["G63", "LX 570", "Zeekr", "Prado", "X5", "GLE", "Li 9", "Gentra"].map(s => `<button class="chip" data-q="${s}">${s}</button>`).join("")}</div>
    <div id="res"></div>`;
  const run = () => findRun($("#q").value.trim());
  let tt; $("#q").oninput = () => { clearTimeout(tt); tt = setTimeout(run, 180); };
  $$("[data-q]").forEach(c => c.onclick = () => { hap("sel"); $("#q").value = c.dataset.q; run(); });
  if (Q) run();
}
const norm = s => s.toUpperCase().replace(/[^A-Z0-9]/g, "");
async function findRun(q) {
  Q = q; const k = norm(q), R = $("#res");
  if (k.length < 2) { R.innerHTML = ""; return; }
  if (!X) { R.innerHTML = `<div class="spin"></div>`; await loadIdx().catch(() => { R.innerHTML = `<div class="empty">Internet aloqasini tekshiring</div>`; }); if (!X || Q !== q) return; }
  const res = X.rows.filter(r => norm(r.t).includes(k));
  if (!res.length) { R.innerHTML = `<div class="empty">«${esc(q)}» bo‘yicha e’lon topilmadi.<br>Masalan: GLE, X5, Prado</div>`; return; }
  const sold = res.filter(r => r.s).length, vs = res.map(r => r.v).sort((a, b) => a - b), med = vs[Math.floor(vs.length / 2)];
  const months = D.stats.months.map(m => m.m);
  const per = months.map(m => ({ m, n: res.filter(r => r.d.startsWith(m)).length }));
  R.innerHTML = `<div class="sstats">
      <div class="kpi"><b>${res.length}</b><span>e’lon</span></div>
      <div class="kpi"><b>${Math.round(sold / res.length * 100)}%</b><span>«Baraka bo‘ldi»</span></div>
      <div class="kpi"><b>${compact(med)}</b><span>o‘rtacha ko‘rish</span></div></div>
    <div class="card"><h3>Oylar bo‘yicha</h3><div id="chQ"></div></div>
    <div class="card"><h3>So‘nggi e’lonlar</h3><div class="list">${res.slice(0, 25).map(r => `<button class="li" data-link="${post(r.m)}"><div class="ph">${r.th ? `<img src="${thumb(r.id)}" alt="" loading="lazy" decoding="async">` : esc((r.b || r.t)[0] || "•")}</div><div><b>${esc(r.t)}</b><span>${dUz(r.d, 1)} · 👁 ${compact(r.v)}</span></div><div class="r">${r.s ? `<span class="sold">🤝 sotildi</span>` : ""}</div></button>`).join("")}</div>
      ${res.length > 25 ? `<p class="sub" style="text-align:center;margin-top:8px">… va yana ${res.length - 25} ta</p>` : ""}</div>
    ${tipH("Yangi mashina kelganda bot shu tarixni o‘zi ko‘rsatadi: model qanchalik tez sotiladi, kim avval sotgan.")}`;
  bars($("#chQ"), per.map((p, i) => { const [y, m] = p.m.split("-").map(Number); return { v: p.n, lab: m === 1 || i === 0 ? MS[m - 1] + " " + String(y).slice(2) : i === per.length - 1 ? MS[m - 1] : "", tip: `${MON[m - 1]} ${y}: ${p.n} ta` }; }), { h: 90 });
  $$("[data-link]", R).forEach(b => b.onclick = () => openLink(b.dataset.link));
}
